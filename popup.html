<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        width: 220px;
        font-family: Arial, sans-serif;
        padding: 10px;
        margin: 0;
      }
      h3 { margin-top: 0; color: #333; }
      p { font-size: 14px; margin: 5px 0; color: #555; }
      .time { font-weight: bold; color: #007bff; }
    </style>
  </head>
  <body>
    <h3>Reading Time</h3>
    <p id="status">Scanning page...</p>
    <p id="result" style="display: none;">Estimated: <span id="time-val" class="time"></span> min read</p>
    <script src="popup.js"></script>
  </body>
</html>
